<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI プロンプト記号 完全ガイド</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:      #f5f0e8;
    --bg2:     #ede6d6;
    --surface: #faf7f2;
    --border:  #ddd5c0;
    --text:    #2c2416;
    --muted:   #7a6e5a;

    --c01:#7c5c2e; --c02:#3d7a47; --c03:#c07030; --c04:#5b7abf;
    --c05:#9b4f8a; --c06:#b8433a; --c07:#2e8a7c; --c08:#6d5b2a;
    --c09:#4a6ea8; --c10:#8a3060; --c11:#3a7a4a; --c12:#c05520;
    --c13:#5060a0; --c14:#7a7a20; --c15:#2e7a60; --c16:#a06030;
    --c17:#c04070; --c18:#3070a0; --c19:#806020; --c20:#504090;
    --c21:#308040; --c22:#a04050; --c23:#604080; --c24:#3a5a30;
    --c25:#3a7050; --c26:#804020; --c27:#205070; --c28:#607030;
    --c29:#702050; --c30:#306050;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse at 20% 10%, rgba(180,150,100,.13) 0%, transparent 55%),
      radial-gradient(ellipse at 80% 90%, rgba(100,140,180,.10) 0%, transparent 55%);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    background: linear-gradient(135deg, #2c2416 0%, #4a3820 60%, #2c3a30 100%);
    color: #f5f0e8;
    text-align: center;
    padding: 56px 24px 48px;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content:'';
    position:absolute; inset:0;
    background-image: repeating-linear-gradient(
      45deg, transparent, transparent 24px,
      rgba(255,255,255,.03) 24px, rgba(255,255,255,.03) 25px);
  }
  .header-badge {
    display:inline-block;
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.25);
    border-radius:999px;
    font-size:.72rem; letter-spacing:.15em;
    padding:4px 16px; margin-bottom:20px;
    text-transform:uppercase; position:relative;
  }
  header h1 {
    font-family:'Noto Serif JP',serif;
    font-size:clamp(1.6rem,5vw,2.8rem);
    font-weight:700; line-height:1.3; margin-bottom:12px; position:relative;
  }
  header h1 span { color:#e8c870; }
  header p {
    font-size:clamp(.85rem,2.5vw,1rem);
    opacity:.75; max-width:560px; margin:0 auto; position:relative;
  }
  .header-count {
    display:inline-flex; align-items:center; gap:8px;
    margin-top:28px;
    background:rgba(255,255,255,.1);
    border-radius:8px; padding:10px 24px; font-size:.9rem; position:relative;
  }
  .header-count strong { color:#e8c870; font-size:1.4rem; }

  /* ── GRID ── */
  .grid-wrapper { max-width:1200px; margin:0 auto; padding:48px 20px 80px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:24px; }
  @media(max-width:900px){ .grid{ grid-template-columns:repeat(2,1fr); } }
  @media(max-width:580px){
    .grid{ grid-template-columns:1fr; gap:16px; }
    .grid-wrapper{ padding:28px 14px 60px; }
  }

  /* ── CARD ── */
  .card {
    background:var(--surface);
    border:1.5px solid var(--border);
    border-radius:16px; overflow:hidden;
    box-shadow:0 2px 12px rgba(0,0,0,.07),0 1px 3px rgba(0,0,0,.05);
    transition:transform .2s ease, box-shadow .2s ease;
    display:flex; flex-direction:column;
  }
  .card:hover {
    transform:translateY(-4px);
    box-shadow:0 10px 30px rgba(0,0,0,.12),0 2px 8px rgba(0,0,0,.07);
  }
  .card-head {
    padding:18px 20px 16px;
    display:flex; align-items:center; gap:14px;
    border-bottom:1px solid var(--border);
  }
  .symbol-badge {
    width:52px; height:52px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono',monospace;
    font-size:1.05rem; font-weight:700; color:#fff;
    flex-shrink:0; text-align:center; padding:4px; line-height:1.15;
  }
  .card-num { font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:2px; }
  .card-name { font-family:'Noto Serif JP',serif; font-size:1.05rem; font-weight:700; color:var(--text); }

  .card-body { padding:16px 20px 20px; flex:1; display:flex; flex-direction:column; gap:14px; }
  .role-label { font-size:.68rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:4px; }
  .role-text { font-size:.88rem; line-height:1.72; color:var(--text); white-space:pre-line; }

  .usage-tags { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .usage-tag {
    font-family:'JetBrains Mono',monospace; font-size:.72rem; font-weight:700;
    padding:3px 10px; border-radius:6px;
    border:1.5px solid var(--accent,#888); color:var(--accent,#888);
  }
  .usage-tag-label { font-size:.65rem; color:var(--muted); }

  .example-box {
    background:var(--bg2); border-radius:10px; padding:12px 14px;
    border-left:3px solid var(--accent,#888);
  }
  .example-label { font-size:.65rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
  .example-code {
    font-family:'JetBrains Mono',monospace; font-size:.78rem;
    line-height:1.65; color:var(--text); white-space:pre-wrap; word-break:break-all;
  }
  .example-code .hl {
    color:var(--accent,#555); font-weight:700;
    background:rgba(0,0,0,.05); border-radius:3px; padding:0 2px;
  }
  .effect-chip {
    display:inline-flex; align-items:center; gap:5px;
    font-size:.72rem; font-weight:700;
    padding:5px 11px; border-radius:999px;
    background:rgba(0,0,0,.06); color:var(--muted); align-self:flex-start;
  }
  .effect-chip::before { content:'✦'; font-size:.6rem; }

  footer {
    background:#2c2416; color:rgba(245,240,232,.55);
    text-align:center; padding:24px;
    font-size:.78rem; letter-spacing:.05em;
  }
</style>
</head>
<body>

<header>
  <div class="header-badge">Prompt Engineering Reference</div>
  <h1>AI プロンプト<span>記号</span>完全ガイド</h1>
  <p>AIへの指示をもっとかしこく伝えるための記号と使い方 30選</p>
  <div class="header-count"><strong>30</strong> 種類の記号を網羅</div>
</header>

<div class="grid-wrapper">
<div class="grid" id="cards"></div>
</div>

<footer>AI プロンプト記号 完全ガイド — 30 symbols for precise communication</footer>

<script>
const symbols = [
  {
    sym:"#", name:"シャープ", color:"var(--c01)",

    usages:[{code:"# 大見出し",label:"大きなまとまり"},{code:"## 中見出し",label:"その中の小分け"}],

  },
  {
    sym:"* / **", name:"アスタリスク", color:"var(--c03)",

    usages:[{code:"* 項目",label:"箇条書き（1つ）"},{code:"**重要語句**",label:"太字・最重要（2つで囲む）"}],

    usages:[{code:"(補足情報)",label:"前提や条件を補足"}],

  },
  {

    usages:[{code:"[書き換える部分]",label:"差し替え場所の目印"}],
    example:"[商品名]の紹介文を書いて。\nターゲット：[対象者]\n文体：[トーン]\n文字数：[字数]字以内",

  {

    usages:[{code:'{"キー": "値"}',label:"データをまとめて渡す"},{code:"{変数名}",label:"テンプレートの差し込み場所"}],
    example:'以下のデータを元に紹介文を書いて。\n{\n  "name": "田中 花子",\n  "job": "デザイナー",\n  "hobby": "旅行"\n}',
    hl:["{","}"], effect:"複数の情報をまとめてきれいに渡せる"

const grid = document.getElementById('cards');
symbols.forEach((s, i) => {
  const num = String(i+1).padStart(2,'0');

  // escape then highlight
  let ex = s.example
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  s.hl.forEach(w => {
    const esc = w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    ex = ex.replace(new RegExp(esc,'g'), `<span class="hl">${w}</span>`);
  });

  const tags = s.usages.map(u =>
    `<span class="usage-tag">${u.code}</span><span class="usage-tag-label">${u.label}</span>`
  ).join('');

  grid.innerHTML += `
    <div class="card" style="--accent:${s.color}">
      <div class="card-head">
        <div class="symbol-badge" style="background:${s.color}">${s.sym}</div>
        <div class="card-title-group">
          <div class="card-num">No.${num}</div>
          <div class="card-name">${s.name}</div>
        </div>
      </div>
      <div class="card-body">
        <div>
          <div class="role-label">どんな記号？</div>
          <div class="role-text">${s.role}</div>
        </div>
        <div class="usage-tags">${tags}</div>
        <div class="example-box" style="border-color:${s.color}">
          <div class="example-label">使用例</div>
          <div class="example-code">${ex}</div>
        </div>
        <div class="effect-chip">${s.effect}</div>
      </div>
    </div>`;
});
